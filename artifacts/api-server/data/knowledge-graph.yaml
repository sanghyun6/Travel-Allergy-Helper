# Curated allergen / ingredient knowledge graph.
# Loaded by `scripts/seed-knowledge-graph.ts`. Idempotent — safe to re-run.
#
# Structure:
#   allergens:   canonical allergen tags (slug, name, category)
#   ingredients: canonical ingredient nodes; each can have aliases (multilingual)
#                and direct allergen tags. Derivations are listed at the bottom
#                so we can describe parent→child relations between ingredients
#                (e.g. "fish-sauce derived_from anchovy", "anchovy is_a fish").

allergens:
  - { slug: peanut,    name: Peanuts,        category: legume }
  - { slug: tree-nut,  name: Tree nuts,      category: nut }
  - { slug: milk,      name: Milk / dairy,   category: dairy }
  - { slug: egg,       name: Eggs,           category: egg }
  - { slug: wheat,     name: Wheat / gluten, category: grain }
  - { slug: soy,       name: Soy,            category: legume }
  - { slug: fish,      name: Fish,           category: fish }
  - { slug: shellfish, name: Shellfish,      category: shellfish }
  - { slug: sesame,    name: Sesame,         category: seed }
  - { slug: mustard,   name: Mustard,        category: seed }
  - { slug: sulphite,  name: Sulphites,      category: additive }
  - { slug: celery,    name: Celery,         category: vegetable }

