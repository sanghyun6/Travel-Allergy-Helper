# Parent → child relations between ingredient/dish nodes.
# `relation` values:
#   contains:     parent (a dish or compound) contains child as ingredient
#   derived_from: child is derived from parent (e.g. fish-sauce derived_from anchovy)
#   is_a:         child is a kind of parent (e.g. anchovy is_a fish — though
#                 we usually express that via direct allergen tags)
derivations:
  # Sauces → underlying allergen ingredients
  - { parent: fish-sauce,           child: anchovy,    relation: derived_from, note: "Most commercial fish sauce is made by fermenting anchovies in salt." }
  - { parent: oyster-sauce,         child: oyster,     relation: derived_from, note: "Sauce is reduced from oyster extracts." }
  - { parent: shrimp-paste,         child: shrimp,     relation: derived_from, note: "Made by fermenting ground shrimp." }
  - { parent: worcestershire-sauce, child: anchovy,    relation: contains,     note: "Anchovies are a defining ingredient of Worcestershire sauce." }
  - { parent: dashi,                child: katsuobushi, relation: contains,    note: "Bonito flakes are simmered with kombu to make traditional dashi." }
  - { parent: ponzu,                child: katsuobushi, relation: contains,    note: "Most ponzu blends in dashi or bonito for umami." }
  - { parent: ponzu,                child: soy-sauce,  relation: contains,     note: "Ponzu shoyu is mixed with soy sauce." }
  - { parent: xo-sauce,             child: shrimp,     relation: contains,     note: "Dried shrimp is a core ingredient." }
  - { parent: xo-sauce,             child: anchovy,    relation: contains,     note: "Many recipes include dried fish such as anchovy." }
  - { parent: caesar-dressing,      child: anchovy,    relation: contains,     note: "Classic Caesar dressing uses anchovies." }
  - { parent: pesto,                child: marzipan,   relation: contains,     note: "Pesto traditionally contains pine nuts (a tree nut)." }
  - { parent: hoisin-sauce,         child: soy-sauce,  relation: contains,     note: "Hoisin is built on a fermented soybean base." }
  - { parent: gochujang,            child: soy-sauce,  relation: contains,     note: "Gochujang is fermented with meju (soybean)." }
  - { parent: ssamjang,             child: gochujang,  relation: contains,     note: "Ssamjang blends gochujang and doenjang (soybean pastes)." }
  - { parent: ssamjang,             child: miso,       relation: contains,     note: "Doenjang is a soybean paste closely related to miso." }
