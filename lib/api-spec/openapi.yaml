openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Gemini AI chat and image operations
  - name: menu
    description: Menu analysis operations
  - name: tts
    description: Text-to-speech operations
  - name: chat
    description: Backboard AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"

  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"

  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /gemini/generate-image:
    post:
      operationId: generateGeminiImage
      tags: [gemini]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiImageResponse"

  /menu/analyze:
    post:
      operationId: analyzeMenu
      tags: [menu]
      summary: Analyze a menu photo using Gemini vision (SSE stream)
      description: |
        Streams menu analysis as Server-Sent Events. Event types:
        - `layout`: initial detected items with bounding boxes (placeholders).
        - `item`: a single fully analyzed item (translation + safety verdict).
        - `item_error`: a single item failed to analyze; other items keep going.
        - `progress`: { completed, failed, total }.
        - `done`: stream finished (after all items have settled).
        - `error`: terminal stream-level error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuAnalysisInput"
      responses:
        "200":
          description: SSE stream of analysis events
          content:
            text/event-stream: {}

  /menu/ingredient-graph/search:
    get:
      operationId: searchIngredientGraph
      tags: [menu]
      summary: Free-text top-k ingredient search with optional citation chains
      description: |
        Resolves a free-text ingredient string (any language) to the top-k closest
        canonical ingredient nodes via exact-alias + pgvector cosine search, and
        also returns the full citation chains reaching each requested allergen.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Free-text ingredient string in any language
        - name: lang
          in: query
          required: false
          schema: { type: string, default: auto }
          description: ISO language hint for the input string (advisory)
        - name: k
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
          description: Maximum number of candidate matches to return
        - name: allergens
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated allergen slugs to chase chains for
      responses:
        "200":
          description: Top-k matches and citation chains
          content:
            application/json:
              schema:
                type: object
                required: [query, language, matches, citations]
                properties:
                  query:    { type: string }
                  language: { type: string }
                  matches:
                    type: array
                    items:
                      type: object
                      required: [ingredient, distance]
                      properties:
                        ingredient: { $ref: "#/components/schemas/GraphIngredientNode" }
                        distance:   { type: number }
                  citations:
                    type: array
                    items:
                      $ref: "#/components/schemas/CitationChain"

  /menu/ingredient-graph/lookup:
    get:
      operationId: lookupIngredientGraphNode
      tags: [menu]
      summary: Look up an ingredient knowledge-graph node by slug (used by citation UI)
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingredient node with aliases and direct allergen tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingredient:
                    $ref: "#/components/schemas/GraphIngredientNode"
                  allergens:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphAllergenNode"
                required: [ingredient, allergens]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"

  /menu/ordering-instructions:
    post:
      operationId: getOrderingInstructions
      tags: [menu]
      summary: Generate ordering instructions in the user's native language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderingInstructionsInput"
      responses:
        "200":
          description: Ordering instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderingInstructionsResult"

  /tts/speak:
    post:
      operationId: textToSpeech
      tags: [tts]
      summary: Convert text to speech using ElevenLabs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsInput"
      responses:
        "200":
          description: Audio stream (audio/mpeg)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to Backboard AI chat with allergy context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GeminiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    GeminiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    GeminiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    GeminiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    GeminiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    GeminiImageInput:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt

    GeminiImageResponse:
      type: object
      properties:
        b64_json:
          type: string
        mimeType:
          type: string
      required:
        - b64_json
        - mimeType

    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MenuAnalysisInput:
      type: object
      properties:
        imageBase64:
          type: string
        mimeType:
          type: string
          default: image/jpeg
        menuLanguage:
          type: string
        restrictions:
          type: array
          items:
            type: string
      required:
        - imageBase64
        - menuLanguage
        - restrictions

    MenuItemBoundingBox:
      type: object
      description: Normalized 0–1000 bounding box (0,0 top-left → 1000,1000 bottom-right).
      properties:
        ymin:
          type: number
        xmin:
          type: number
        ymax:
          type: number
        xmax:
          type: number
      required:
        - ymin
        - xmin
        - ymax
        - xmax

    MenuAllergenFlag:
      type: object
      properties:
        name:
          type: string
        severity:
          type: string
      required:
        - name
        - severity

    MenuItem:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        safetyLevel:
          type: string
        conflictingRestrictions:
          type: array
          items:
            type: string
        allergenFlags:
          type: array
          items:
            $ref: "#/components/schemas/MenuAllergenFlag"
        translatedName:
          type: string
        boundingBox:
          $ref: "#/components/schemas/MenuItemBoundingBox"
        nameBox:
          $ref: "#/components/schemas/MenuItemBoundingBox"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationChain"
      required:
        - name
        - description
        - safetyLevel
        - conflictingRestrictions
        - allergenFlags
        - translatedName

    GraphIngredientNode:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        source:
          type: string
        sourceUrl:
          type: ["string", "null"]
        aliases:
          type: array
          items:
            type: object
            properties:
              alias:
                type: string
              language:
                type: string
            required: [alias, language]
      required:
        - id
        - slug
        - name
        - source
        - aliases

    GraphAllergenNode:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        category:
          type: string
      required:
        - slug
        - name
        - category

    CitationLink:
      type: object
      description: One step in a citation chain. Exactly one of ingredient/relation/allergen is set.
      properties:
        kind:
          type: string
          enum: [ingredient, relation, allergen]
        ingredient:
          $ref: "#/components/schemas/GraphIngredientNode"
        relation:
          type: string
        note:
          type: ["string", "null"]
        allergen:
          $ref: "#/components/schemas/GraphAllergenNode"
      required:
        - kind

    CitationChain:
      type: object
      properties:
        sourceText:
          type: string
        matched:
          $ref: "#/components/schemas/GraphIngredientNode"
        matchDistance:
          type: number
        allergen:
          $ref: "#/components/schemas/GraphAllergenNode"
        links:
          type: array
          items:
            $ref: "#/components/schemas/CitationLink"
      required:
        - sourceText
        - matched
        - matchDistance
        - allergen
        - links

    MenuAnalysisResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
        detectedLanguage:
          type: string
      required:
        - items
        - detectedLanguage

    OrderingInstructionsInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
        targetLanguage:
          type: string
        restrictions:
          type: array
          items:
            type: string
        menuLanguage:
          type: string
      required:
        - items
        - targetLanguage
        - restrictions
        - menuLanguage

    OrderingInstruction:
      type: object
      properties:
        item:
          type: string
        phrase:
          type: string
        pronunciation:
          type: string
      required:
        - item
        - phrase
        - pronunciation

    OrderingInstructionsResult:
      type: object
      properties:
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/OrderingInstruction"
        fullOrderPhrase:
          type: string
      required:
        - instructions
        - fullOrderPhrase

    TtsInput:
      type: object
      properties:
        text:
          type: string
        language:
          type: string
      required:
        - text
        - language

    TtsResponse:
      type: object
      properties:
        audioBase64:
          type: string
        mimeType:
          type: string
      required:
        - audioBase64
        - mimeType

    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
        threadId:
          type: ["string", "null"]
        restrictions:
          type: array
          items:
            type: string
        cartItems:
          type: array
          items:
            type: string
        orderingPhrases:
          type: array
          items:
            type: string
      required:
        - message
        - restrictions
        - cartItems
        - orderingPhrases

    ChatMessageResult:
      type: object
      properties:
        reply:
          type: string
        threadId:
          type: string
      required:
        - reply
        - threadId
